name: LaTeX build

on:
  push:
    branches: [main]
    paths:
      - "**/*.tex"
      - "**/*.bib"
      - "**/*.sty"
      - "**/*.cls"
      - "**/*.bst"
      - ".latexmkrc"
      - "StylesAndSettings/**"
      - "References/**"
      - "inquiries/**"
      - ".github/workflows/latex.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.tex"
      - "**/*.bib"
      - "**/*.sty"
      - "**/*.cls"
      - "**/*.bst"
      - ".latexmkrc"
      - "StylesAndSettings/**"
      - "References/**"
      - "inquiries/**"
      - ".github/workflows/latex.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: latex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover LaTeX roots
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Build matrix
        id: set
        run: |
          set -euo pipefail
          entries='{"root_file":"ResearchManual.tex","artifact":"researchmanual-pdf","pdf":"ResearchManual.pdf"}'
          shopt -s nullglob
          for response in inquiries/*/response.tex; do
            slug=$(basename "$(dirname "$response")")
            [ "$slug" = "_template" ] && continue
            entries="${entries},{\"root_file\":\"${response}\",\"artifact\":\"${slug}-pdf\",\"pdf\":\"inquiries/${slug}/response.pdf\"}"
          done
          matrix="{\"include\":[${entries}]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Discovered roots:"
          printf '%s\n' "$matrix" | jq .

  build:
    name: Compile ${{ matrix.root_file }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Compile
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3
        with:
          root_file: ${{ matrix.root_file }}
          work_in_root_file_dir: true
          latexmk_use_lualatex: false
          latexmk_shell_escape: true
          continue_on_error: false
          extra_system_packages: "py3-pygments"
          post_compile: "latexmk -c"

      - name: Upload PDF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pdf }}
          if-no-files-found: error
          retention-days: 14

  lacheck:
    name: Static checks (chktex)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install chktex
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chktex

      - name: Run chktex
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '*.tex' ':!inquiries/_template/**')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .tex files."
            exit 0
          fi
          chktex -q -n1 -n6 -n8 -n12 -n24 -n36 -n38 -n44 "${files[@]}"
