[project]
name = "protocolpolicylab"
version = "0.0.0"
description = "Helper scripts for the Protocol Policy Lab thesis: bibliography curation, figure generation, release tooling."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Zac Kienzle" }]
keywords = [
  "policy-research",
  "latex",
  "thesis",
  "bibliography",
  "reproducible-research",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = []

[project.optional-dependencies]
notebooks = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
]
figures = [
  "numpy>=2.1",
  "matplotlib>=3.9",
  "pandas>=2.2",
]
bib = [
  "bibtexparser>=1.4,<2",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.uv]
required-version = ">=0.5"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "StylesAndSettings",
  ".github",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "A",
  "C4",
  "SIM",
  "ARG",
  "PIE",
  "PT",
  "RUF",
  "PLE",
  "PLW",
  "TRY",
  "PERF",
  "FURB",
  "ERA",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "ARG002"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[tool.pyright]
include = ["scripts", "tests"]
exclude = ["StylesAndSettings", "**/__pycache__", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportMissingImports = "error"
reportMissingTypeStubs = "warning"
reportImplicitOverride = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--showlocals",
  "--tb=short",
]
filterwarnings = [
  "error",
]

[tool.coverage.run]
source = ["scripts"]
branch = true

[tool.coverage.report]
exclude_also = [
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
